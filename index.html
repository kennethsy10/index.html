<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BURGER HUB - Inventory System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }

    /* Header Styling */
    header { background: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .brand { font-size: 18px; font-weight: 800; color: #f59e0b; display: flex; align-items: center; gap: 8px; }
    
    /* Navigation Pane (7 Features Horizontal Scroll) */
    .nav-bar { display: flex; background: #1e293b; overflow-x: auto; border-bottom: 2px solid #334155; white-space: nowrap; -webkit-overflow-scrolling: touch; }
    .nav-btn { background: none; border: none; color: #94a3b8; padding: 12px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .nav-btn.active { color: #f59e0b; border-bottom: 3px solid #f59e0b; }

    /* Container Layout */
    .container { padding: 16px; flex: 1; max-width: 800px; margin: 0 auto; width: 100%; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }

    /* Inputs & Buttons */
    label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-top: 8px; display: block; }
    input, select, button { width: 100%; padding: 12px; margin-top: 4px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
    button.btn-amber { background: #f59e0b; color: #0f172a; border: none; font-weight: 700; cursor: pointer; margin-top: 12px; }
    button.btn-danger { background: #ef4444; color: #fff; border: none; font-weight: 700; cursor: pointer; padding: 6px 12px; width: auto; font-size: 12px; border-radius: 6px; }

    /* Metric Grids */
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
    .metric-box { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
    .metric-val { font-size: 20px; font-weight: 800; color: #f59e0b; margin-top: 4px; }

    /* Tables */
    .table-responsive { overflow-x: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: #0f172a; color: #f59e0b; padding: 10px; border-bottom: 1px solid #334155; }
    td { padding: 10px; border-bottom: 1px solid #334155; color: #cbd5e1; }

    .hidden { display: none !important; }
    .login-wrapper { display: flex; align-items: center; justify-content: center; min-height: 90vh; }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="loginView" class="container login-wrapper">
    <div class="card" style="width: 100%; max-width: 360px; text-align: center;">
      <div style="font-size: 40px;">🍔</div>
      <div class="brand" style="justify-content: center; font-size: 24px; margin-bottom: 4px;">BURGER HUB</div>
      <p style="font-size: 12px; color: #94a3b8; margin-bottom: 16px;">Inventory & Management System</p>
      
      <form onsubmit="event.preventDefault(); handleLogin();">
        <label style="text-align:left;">Username</label>
        <input type="text" id="username" required autocomplete="off">
        
        <label style="text-align:left;">Password</label>
        <input type="password" id="password" required>
        
        <button type="submit" class="btn-amber" id="loginBtn">LOG IN</button>
      </form>
      <p id="loginError" style="color: #ef4444; font-size: 12px; margin-top: 8px; display: none;"></p>
    </div>
  </div>

  <!-- MAIN APP SECTION -->
  <div id="appView" class="hidden">
    <header>
      <div class="brand">🍔 BURGER HUB</div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span id="userBadge" style="font-size: 12px; color: #cbd5e1;">-</span>
        <button class="btn-danger" onclick="logout()">Logout</button>
      </div>
    </header>

    <!-- Navigation Menu (7 Core Features) -->
    <div class="nav-bar">
      <button class="nav-btn active" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="nav-btn" onclick="switchTab('catalog')">Catalog</button>
      <button class="nav-btn" onclick="switchTab('stock')">Stock In/Out</button>
      <button class="nav-btn" onclick="switchTab('suppliers')">Suppliers</button>
      <button class="nav-btn" onclick="switchTab('alerts')">Low Stock</button>
      <button class="nav-btn" onclick="switchTab('logs')">Audit Logs</button>
      <button class="nav-btn" onclick="switchTab('users')">Users</button>
    </div>

    <div class="container">
      <!-- 1. DASHBOARD -->
      <div id="tab-dashboard" class="tab-content card">
        <h3 style="margin-bottom:12px; color:#f59e0b;">Store Dashboard</h3>
        <div class="grid-3">
          <div class="metric-box"><div style="font-size:10px; color:#94a3b8;">ITEMS</div><div class="metric-val" id="m-items">0</div></div>
          <div class="metric-box"><div style="font-size:10px; color:#94a3b8;">VALUATION</div><div class="metric-val" id="m-val">₱0</div></div>
          <div class="metric-box"><div style="font-size:10px; color:#94a3b8;">LOW STOCK</div><div class="metric-val" id="m-low" style="color:#ef4444;">0</div></div>
        </div>
      </div>

      <!-- 2. CATALOG -->
      <div id="tab-catalog" class="tab-content card hidden">
        <h3 style="color:#f59e0b;">Item Catalog</h3>
        <div id="catalogTable" class="table-responsive">Loading...</div>
      </div>

      <!-- 3. STOCK IN/OUT -->
      <div id="tab-stock" class="tab-content card hidden">
        <h3 style="color:#f59e0b; margin-bottom:8px;">Stock Adjustment</h3>
        <label>Item ID</label>
        <input type="text" id="stkId" placeholder="e.g. 101">
        <label>Movement Type</label>
        <select id="stkType"><option value="STOCK IN">Stock IN (+)</option><option value="STOCK OUT">Stock OUT (-)</option></select>
        <label>Quantity</label>
        <input type="number" id="stkQty" placeholder="0">
        <label>Notes / Reason</label>
        <input type="text" id="stkNotes" placeholder="e.g. Daily restocking, Expired patty">
        <button class="btn-amber" onclick="submitStock()">Submit Stock Transaction</button>
      </div>

      <!-- 4. SUPPLIERS -->
      <div id="tab-suppliers" class="tab-content card hidden">
        <h3 style="color:#f59e0b;">Supplier Contacts</h3>
        <div id="supplierTable" class="table-responsive">Loading...</div>
      </div>

      <!-- 5. LOW STOCK ALERTS -->
      <div id="tab-alerts" class="tab-content card hidden">
        <h3 style="color:#ef4444;">Low Stock Items</h3>
        <div id="alertsTable" class="table-responsive">Loading...</div>
      </div>

      <!-- 6. AUDIT LOGS -->
      <div id="tab-logs" class="tab-content card hidden">
        <h3 style="color:#f59e0b;">Transaction Audit Trail</h3>
        <div id="logsTable" class="table-responsive">Loading...</div>
      </div>

      <!-- 7. USER MANAGEMENT -->
      <div id="tab-users" class="tab-content card hidden">
        <h3 style="color:#f59e0b;">System Users</h3>
        <div id="usersTable" class="table-responsive">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    // REPLACE THIS WITH YOUR APPS SCRIPT WEB APP URL
    const API_URL = "https://script.google.com/macros/s/AKfycbyRoGfAeeA73D0t7f3G0ndNil_-XHPjNCsG0qBLt8Zr8OnkJFky7MyNjVFohHOKNPI/exec"; 
    let sessionToken = null;

    function apiCall(payload, callback) {
      if (sessionToken) payload.token = sessionToken;
      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => callback(data))
      .catch(err => alert("Connection error. Ensure your APPS SCRIPT URL is correct."));
    }

    function handleLogin() {
      const u = document.getElementById("username").value;
      const p = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("loginError");

      btn.innerText = "Authenticating...";
      btn.disabled = true;
      err.style.display = "none";

      apiCall({ action: "login", username: u, password: p }, res => {
        btn.innerText = "LOG IN";
        btn.disabled = false;
        if (res.success) {
          sessionToken = res.token;
          document.getElementById("userBadge").innerText = res.username + " (" + res.role + ")";
          document.getElementById("loginView").classList.add("hidden");
          document.getElementById("appView").classList.remove("hidden");
          loadDashboard();
        } else {
          err.innerText = res.message;
          err.style.display = "block";
        }
      });
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.remove('hidden');
      event.target.classList.add('active');

      if (tabName === 'dashboard') loadDashboard();
      if (tabName === 'catalog') loadCatalog();
      if (tabName === 'suppliers') loadSuppliers();
      if (tabName === 'alerts') loadLowStock();
      if (tabName === 'logs') loadLogs();
      if (tabName === 'users') loadUsers();
    }

    function renderTable(rawMatrix) {
      if (!rawMatrix || rawMatrix.length === 0) return "<p>No data available.</p>";
      let html = "<table><tr>";
      rawMatrix[0].forEach(h => html += `<th>${h}</th>`);
      html += "</tr>";
      for (let i = 1; i < rawMatrix.length; i++) {
        html += "<tr>";
        rawMatrix[i].forEach(cell => html += `<td>${cell}</td>`);
        html += "</tr>";
      }
      return html + "</table>";
    }

    function loadDashboard() {
      apiCall({ action: "getDashboard" }, res => {
        if (res.success) {
          document.getElementById("m-items").innerText = res.totalItems;
          document.getElementById("m-val").innerText = "₱" + res.totalValue;
          document.getElementById("m-low").innerText = res.lowStock;
        }
      });
    }

    function loadCatalog() { apiCall({ action: "getInventory" }, res => document.getElementById("catalogTable").innerHTML = renderTable(res.data)); }
    function loadSuppliers() { apiCall({ action: "getSuppliers" }, res => document.getElementById("supplierTable").innerHTML = renderTable(res.data)); }
    function loadLowStock() { apiCall({ action: "getLowStock" }, res => document.getElementById("alertsTable").innerHTML = renderTable(res.data)); }
    function loadLogs() { apiCall({ action: "getTransactions" }, res => document.getElementById("logsTable").innerHTML = renderTable(res.data)); }
    function loadUsers() { apiCall({ action: "getUsers" }, res => document.getElementById("usersTable").innerHTML = renderTable(res.data)); }

    function submitStock() {
      const itemId = document.getElementById("stkId").value;
      const type = document.getElementById("stkType").value;
      let qty = parseInt(document.getElementById("stkQty").value);
      const notes = document.getElementById("stkNotes").value;

      if (!itemId || isNaN(qty)) return alert("Please enter valid item ID and quantity.");
      if (type === "STOCK OUT") qty = -qty;

      apiCall({ action: "updateStock", itemId: itemId, qtyChange: qty, type: type, notes: notes }, res => {
        alert(res.success ? "Stock transaction successful!" : "Error: " + res.message);
        if (res.success) switchTab('catalog');
      });
    }

    function logout() {
      sessionToken = null;
      document.getElementById("appView").classList.add("hidden");
      document.getElementById("loginView").classList.remove("hidden");
    }
  </script>
</body>
</html>
